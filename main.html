<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .chess-square-light {
            background-color: #f0d9b5;
        }
        
        .chess-square-dark {
            background-color: #b58863;
        }
        
        .chess-piece {
            cursor: pointer;
            transition: transform 0.2s;
            z-index: 10;
        }
        
        .chess-piece:hover {
            transform: scale(1.1);
        }
        
        .selected-piece {
            box-shadow: 0 0 10px 5px rgba(255, 255, 0, 0.7);
            transform: scale(1.05);
        }
        
        .possible-move {
            position: relative;
        }
        
        .possible-move::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 30%;
            height: 30%;
            border-radius: 50%;
            background-color: rgba(0, 0, 0, 0.3);
        }
        
        .capture-move::after {
            border: 3px solid rgba(0, 0, 0, 0.3);
            background-color: transparent;
            width: 80%;
            height: 80%;
            border-radius: 50%;
        }
        
        .last-move {
            background-color: rgba(255, 255, 0, 0.3) !important;
        }
        
        .check {
            background-color: rgba(255, 0, 0, 0.5) !important;
        }
        
        .promotion-menu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 100;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            padding: 10px;
        }
        
        .notation {
            position: absolute;
            font-size: 10px;
            pointer-events: none;
        }
        
        .notation-file {
            bottom: 2px;
            right: 4px;
        }
        
        .notation-rank {
            top: 2px;
            left: 4px;
        }
    </style>
</head>
<body class="bg-gray-900 min-h-screen flex flex-col items-center justify-center p-4">
    <div class="text-center mb-4">
        <h1 class="text-3xl font-bold text-white mb-2">Chess Game</h1>
        <div id="game-status" class="text-xl text-gray-300">White's turn</div>
    </div>
    
    <div class="relative">
        <div id="chess-board" class="grid grid-cols-8 grid-rows-8 w-[560px] h-[560px] border-4 border-gray-700 relative">
            <!-- Chess board will be generated by JavaScript -->
        </div>
        
        <div id="promotion-menu" class="promotion-menu hidden">
            <div class="grid grid-cols-4 gap-2">
                <div class="w-16 h-16 flex items-center justify-center cursor-pointer hover:bg-gray-200 rounded" data-piece="queen">
                    <i class="fas fa-chess-queen text-4xl text-black"></i>
                </div>
                <div class="w-16 h-16 flex items-center justify-center cursor-pointer hover:bg-gray-200 rounded" data-piece="rook">
                    <i class="fas fa-chess-rook text-4xl text-black"></i>
                </div>
                <div class="w-16 h-16 flex items-center justify-center cursor-pointer hover:bg-gray-200 rounded" data-piece="bishop">
                    <i class="fas fa-chess-bishop text-4xl text-black"></i>
                </div>
                <div class="w-16 h-16 flex items-center justify-center cursor-pointer hover:bg-gray-200 rounded" data-piece="knight">
                    <i class="fas fa-chess-knight text-4xl text-black"></i>
                </div>
            </div>
        </div>
    </div>
    
    <div class="mt-6 flex space-x-4">
        <button id="new-game-btn" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 transition">
            New Game
        </button>
        <button id="undo-btn" class="px-4 py-2 bg-gray-600 text-white rounded hover:bg-gray-700 transition">
            Undo Move
        </button>
    </div>
    
    <div id="move-history" class="mt-6 w-full max-w-md bg-gray-800 p-4 rounded max-h-40 overflow-y-auto">
        <h3 class="text-white font-semibold mb-2">Move History</h3>
        <div id="history-list" class="text-gray-300"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Game state
            const gameState = {
                board: Array(8).fill().map(() => Array(8).fill(null)),
                currentPlayer: 'white',
                selectedSquare: null,
                possibleMoves: [],
                moveHistory: [],
                capturedPieces: { white: [], black: [] },
                check: false,
                enPassantTarget: null,
                castlingRights: {
                    white: { kingSide: true, queenSide: true },
                    black: { kingSide: true, queenSide: true }
                },
                halfMoveClock: 0,
                fullMoveNumber: 1
            };
            
            // Initialize the board
            function initializeBoard() {
                const boardElement = document.getElementById('chess-board');
                boardElement.innerHTML = '';
                
                // Create chess board squares
                for (let row = 0; row < 8; row++) {
                    for (let col = 0; col < 8; col++) {
                        const square = document.createElement('div');
                        square.className = `relative ${(row + col) % 2 === 0 ? 'chess-square-light' : 'chess-square-dark'}`;
                        square.dataset.row = row;
                        square.dataset.col = col;
                        square.id = `square-${row}-${col}`;
                        
                        // Add notation
                        if (row === 7) {
                            const fileNotation = document.createElement('div');
                            fileNotation.className = 'notation notation-file';
                            fileNotation.textContent = String.fromCharCode(97 + col);
                            square.appendChild(fileNotation);
                        }
                        
                        if (col === 0) {
                            const rankNotation = document.createElement('div');
                            rankNotation.className = 'notation notation-rank';
                            rankNotation.textContent = 8 - row;
                            square.appendChild(rankNotation);
                        }
                        
                        square.addEventListener('click', () => handleSquareClick(row, col));
                        boardElement.appendChild(square);
                    }
                }
                
                // Set up initial piece positions
                setupInitialPieces();
                updateBoardView();
            }
            
            // Set up initial pieces
            function setupInitialPieces() {
                // Clear the board
                for (let row = 0; row < 8; row++) {
                    for (let col = 0; col < 8; col++) {
                        gameState.board[row][col] = null;
                    }
                }
                
                // Pawns
                for (let col = 0; col < 8; col++) {
                    gameState.board[1][col] = { type: 'pawn', color: 'black', hasMoved: false };
                    gameState.board[6][col] = { type: 'pawn', color: 'white', hasMoved: false };
                }
                
                // Rooks
                gameState.board[0][0] = { type: 'rook', color: 'black', hasMoved: false };
                gameState.board[0][7] = { type: 'rook', color: 'black', hasMoved: false };
                gameState.board[7][0] = { type: 'rook', color: 'white', hasMoved: false };
                gameState.board[7][7] = { type: 'rook', color: 'white', hasMoved: false };
                
                // Knights
                gameState.board[0][1] = { type: 'knight', color: 'black' };
                gameState.board[0][6] = { type: 'knight', color: 'black' };
                gameState.board[7][1] = { type: 'knight', color: 'white' };
                gameState.board[7][6] = { type: 'knight', color: 'white' };
                
                // Bishops
                gameState.board[0][2] = { type: 'bishop', color: 'black' };
                gameState.board[0][5] = { type: 'bishop', color: 'black' };
                gameState.board[7][2] = { type: 'bishop', color: 'white' };
                gameState.board[7][5] = { type: 'bishop', color: 'white' };
                
                // Queens
                gameState.board[0][3] = { type: 'queen', color: 'black' };
                gameState.board[7][3] = { type: 'queen', color: 'white' };
                
                // Kings
                gameState.board[0][4] = { type: 'king', color: 'black', hasMoved: false };
                gameState.board[7][4] = { type: 'king', color: 'white', hasMoved: false };
                
                // Reset game state
                gameState.currentPlayer = 'white';
                gameState.selectedSquare = null;
                gameState.possibleMoves = [];
                gameState.moveHistory = [];
                gameState.capturedPieces = { white: [], black: [] };
                gameState.check = false;
                gameState.enPassantTarget = null;
                gameState.castlingRights = {
                    white: { kingSide: true, queenSide: true },
                    black: { kingSide: true, queenSide: true }
                };
                gameState.halfMoveClock = 0;
                gameState.fullMoveNumber = 1;
                
                updateGameStatus();
            }
            
            // Update the visual representation of the board
            function updateBoardView() {
                // Clear all pieces and highlights
                document.querySelectorAll('#chess-board > div').forEach(square => {
                    // Remove all pieces
                    const piece = square.querySelector('.chess-piece');
                    if (piece) piece.remove();
                    
                    // Remove highlights
                    square.classList.remove('selected-piece', 'possible-move', 'capture-move', 'last-move', 'check');
                });
                
                // Highlight last move if any
                if (gameState.moveHistory.length > 0) {
                    const lastMove = gameState.moveHistory[gameState.moveHistory.length - 1];
                    document.getElementById(`square-${lastMove.from.row}-${lastMove.from.col}`).classList.add('last-move');
                    document.getElementById(`square-${lastMove.to.row}-${lastMove.to.col}`).classList.add('last-move');
                }
                
                // Highlight king in check
                if (gameState.check) {
                    const kingColor = gameState.currentPlayer;
                    for (let row = 0; row < 8; row++) {
                        for (let col = 0; col < 8; col++) {
                            const piece = gameState.board[row][col];
                            if (piece && piece.type === 'king' && piece.color === kingColor) {
                                document.getElementById(`square-${row}-${col}`).classList.add('check');
                                break;
                            }
                        }
                    }
                }
                
                // Place pieces on the board
                for (let row = 0; row < 8; row++) {
                    for (let col = 0; col < 8; col++) {
                        const piece = gameState.board[row][col];
                        if (piece) {
                            const square = document.getElementById(`square-${row}-${col}`);
                            const pieceElement = document.createElement('i');
                            pieceElement.className = `chess-piece fas fa-chess-${piece.type} text-4xl absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2`;
                            pieceElement.style.color = piece.color === 'white' ? '#ffffff' : '#000000';
                            square.appendChild(pieceElement);
                        }
                    }
                }
                
                // Highlight selected piece and possible moves
                if (gameState.selectedSquare) {
                    const { row, col } = gameState.selectedSquare;
                    document.getElementById(`square-${row}-${col}`).classList.add('selected-piece');
                    
                    gameState.possibleMoves.forEach(move => {
                        const square = document.getElementById(`square-${move.row}-${move.col}`);
                        square.classList.add(move.capture ? 'capture-move' : 'possible-move');
                    });
                }
            }
            
            // Handle square click
            function handleSquareClick(row, col) {
                const piece = gameState.board[row][col];
                
                // If no piece is selected and the clicked square has a piece of the current player's color
                if (!gameState.selectedSquare && piece && piece.color === gameState.currentPlayer) {
                    gameState.selectedSquare = { row, col };
                    gameState.possibleMoves = getPossibleMoves(row, col);
                    updateBoardView();
                    return;
                }
                
                // If a piece is already selected
                if (gameState.selectedSquare) {
                    const { row: selectedRow, col: selectedCol } = gameState.selectedSquare;
                    const selectedPiece = gameState.board[selectedRow][selectedCol];
                    
                    // Check if the clicked square is a possible move
                    const isPossibleMove = gameState.possibleMoves.some(move => 
                        move.row === row && move.col === col
                    );
                    
                    if (isPossibleMove) {
                        // Make the move
                        makeMove(selectedRow, selectedCol, row, col);
                    } else if (piece && piece.color === gameState.currentPlayer) {
                        // Select a different piece of the same color
                        gameState.selectedSquare = { row, col };
                        gameState.possibleMoves = getPossibleMoves(row, col);
                        updateBoardView();
                    } else {
                        // Deselect
                        gameState.selectedSquare = null;
                        gameState.possibleMoves = [];
                        updateBoardView();
                    }
                }
            }
            
            // Get possible moves for a piece
            function getPossibleMoves(row, col) {
                const piece = gameState.board[row][col];
                if (!piece) return [];
                
                const moves = [];
                
                switch (piece.type) {
                    case 'pawn':
                        getPawnMoves(row, col, piece.color, moves);
                        break;
                    case 'rook':
                        getRookMoves(row, col, piece.color, moves);
                        break;
                    case 'knight':
                        getKnightMoves(row, col, piece.color, moves);
                        break;
                    case 'bishop':
                        getBishopMoves(row, col, piece.color, moves);
                        break;
                    case 'queen':
                        getRookMoves(row, col, piece.color, moves);
                        getBishopMoves(row, col, piece.color, moves);
                        break;
                    case 'king':
                        getKingMoves(row, col, piece.color, moves);
                        break;
                }
                
                // Filter out moves that would leave the king in check
                return moves.filter(move => {
                    // Simulate the move
                    const originalBoard = JSON.parse(JSON.stringify(gameState.board));
                    const originalEnPassant = gameState.enPassantTarget;
                    const originalCastling = JSON.parse(JSON.stringify(gameState.castlingRights));
                    
                    // Make the move on a copy of the board
                    const tempBoard = JSON.parse(JSON.stringify(gameState.board));
                    const movingPiece = tempBoard[row][col];
                    tempBoard[row][col] = null;
                    
                    // Handle en passant capture
                    if (movingPiece.type === 'pawn' && move.enPassant) {
                        tempBoard[move.enPassant.row][move.enPassant.col] = null;
                    }
                    
                    // Handle castling
                    if (movingPiece.type === 'king' && Math.abs(move.col - col) === 2) {
                        // Move the rook
                        if (move.col > col) { // Kingside
                            tempBoard[row][7] = null;
                            tempBoard[row][5] = { type: 'rook', color: movingPiece.color, hasMoved: true };
                        } else { // Queenside
                            tempBoard[row][0] = null;
                            tempBoard[row][3] = { type: 'rook', color: movingPiece.color, hasMoved: true };
                        }
                    }
                    
                    tempBoard[move.row][move.col] = movingPiece;
                    
                    // Check if the king is in check after this move
                    const kingColor = piece.color;
                    const isCheck = isKingInCheck(tempBoard, kingColor);
                    
                    // Restore original state
                    gameState.board = originalBoard;
                    gameState.enPassantTarget = originalEnPassant;
                    gameState.castlingRights = originalCastling;
                    
                    return !isCheck;
                });
            }
            
            // Pawn moves
            function getPawnMoves(row, col, color, moves) {
                const direction = color === 'white' ? -1 : 1;
                const startRow = color === 'white' ? 6 : 1;
                
                // Forward move
                if (isValidSquare(row + direction, col) && !gameState.board[row + direction][col]) {
                    moves.push({ row: row + direction, col });
                    
                    // Double move from starting position
                    if (row === startRow && !gameState.board[row + 2 * direction][col]) {
                        moves.push({ row: row + 2 * direction, col, enPassantable: true });
                    }
                }
                
                // Capture moves
                for (const colOffset of [-1, 1]) {
                    const newCol = col + colOffset;
                    if (isValidSquare(row + direction, newCol)) {
                        // Normal capture
                        const targetPiece = gameState.board[row + direction][newCol];
                        if (targetPiece && targetPiece.color !== color) {
                            moves.push({ row: row + direction, col: newCol, capture: true });
                        }
                        
                        // En passant capture
                        if (gameState.enPassantTarget && 
                            gameState.enPassantTarget.row === row && 
                            gameState.enPassantTarget.col === newCol) {
                            moves.push({ 
                                row: row + direction, 
                                col: newCol, 
                                capture: true,
                                enPassant: { row: row, col: newCol }
                            });
                        }
                    }
                }
            }
            
            // Rook moves
            function getRookMoves(row, col, color, moves) {
                const directions = [
                    { dr: -1, dc: 0 }, // up
                    { dr: 1, dc: 0 },  // down
                    { dr: 0, dc: -1 }, // left
                    { dr: 0, dc: 1 }   // right
                ];
                
                getSlidingMoves(row, col, color, directions, moves);
            }
            
            // Knight moves
            function getKnightMoves(row, col, color, moves) {
                const knightMoves = [
                    { dr: -2, dc: -1 }, { dr: -2, dc: 1 },
                    { dr: -1, dc: -2 }, { dr: -1, dc: 2 },
                    { dr: 1, dc: -2 }, { dr: 1, dc: 2 },
                    { dr: 2, dc: -1 }, { dr: 2, dc: 1 }
                ];
                
                knightMoves.forEach(move => {
                    const newRow = row + move.dr;
                    const newCol = col + move.dc;
                    
                    if (isValidSquare(newRow, newCol)) {
                        const piece = gameState.board[newRow][newCol];
                        if (!piece || piece.color !== color) {
                            moves.push({ 
                                row: newRow, 
                                col: newCol, 
                                capture: !!piece 
                            });
                        }
                    }
                });
            }
            
            // Bishop moves
            function getBishopMoves(row, col, color, moves) {
                const directions = [
                    { dr: -1, dc: -1 }, // up-left
                    { dr: -1, dc: 1 },  // up-right
                    { dr: 1, dc: -1 },  // down-left
                    { dr: 1, dc: 1 }    // down-right
                ];
                
                getSlidingMoves(row, col, color, directions, moves);
            }
            
            // King moves
            function getKingMoves(row, col, color, moves) {
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        if (dr === 0 && dc === 0) continue;
                        
                        const newRow = row + dr;
                        const newCol = col + dc;
                        
                        if (isValidSquare(newRow, newCol)) {
                            const piece = gameState.board[newRow][newCol];
                            if (!piece || piece.color !== color) {
                                moves.push({ 
                                    row: newRow, 
                                    col: newCol, 
                                    capture: !!piece 
                                });
                            }
                        }
                    }
                }
                
                // Castling
                if (!gameState.board[row][col].hasMoved && !isKingInCheck(gameState.board, color)) {
                    // Kingside castling
                    if (gameState.castlingRights[color].kingSide) {
                        let canCastle = true;
                        for (let c = col + 1; c < 7; c++) {
                            if (gameState.board[row][c]) {
                                canCastle = false;
                                break;
                            }
                        }
                        
                        if (canCastle && gameState.board[row][7] && 
                            gameState.board[row][7].type === 'rook' && 
                            !gameState.board[row][7].hasMoved) {
                            // Check if squares between are not under attack
                            if (!isSquareUnderAttack(row, col + 1, color) && 
                                !isSquareUnderAttack(row, col + 2, color)) {
                                moves.push({ 
                                    row: row, 
                                    col: col + 2, 
                                    castle: 'kingSide' 
                                });
                            }
                        }
                    }
                    
                    // Queenside castling
                    if (gameState.castlingRights[color].queenSide) {
                        let canCastle = true;
                        for (let c = col - 1; c > 0; c--) {
                            if (gameState.board[row][c]) {
                                canCastle = false;
                                break;
                            }
                        }
                        
                        if (canCastle && gameState.board[row][0] && 
                            gameState.board[row][0].type === 'rook' && 
                            !gameState.board[row][0].hasMoved) {
                            // Check if squares between are not under attack
                            if (!isSquareUnderAttack(row, col - 1, color) && 
                                !isSquareUnderAttack(row, col - 2, color)) {
                                moves.push({ 
                                    row: row, 
                                    col: col - 2, 
                                    castle: 'queenSide' 
                                });
                            }
                        }
                    }
                }
            }
            
            // Helper function for sliding pieces (rook, bishop, queen)
            function getSlidingMoves(row, col, color, directions, moves) {
                directions.forEach(dir => {
                    for (let i = 1; i < 8; i++) {
                        const newRow = row + i * dir.dr;
                        const newCol = col + i * dir.dc;
                        
                        if (!isValidSquare(newRow, newCol)) break;
                        
                        const piece = gameState.board[newRow][newCol];
                        if (!piece) {
                            moves.push({ row: newRow, col: newCol });
                        } else {
                            if (piece.color !== color) {
                                moves.push({ 
                                    row: newRow, 
                                    col: newCol, 
                                    capture: true 
                                });
                            }
                            break;
                        }
                    }
                });
            }
            
            // Check if a square is valid (within board bounds)
            function isValidSquare(row, col) {
                return row >= 0 && row < 8 && col >= 0 && col < 8;
            }
            
            // Make a move
            function makeMove(fromRow, fromCol, toRow, toCol) {
                const piece = gameState.board[fromRow][fromCol];
                const targetPiece = gameState.board[toRow][toCol];
                
                // Record the move
                const moveRecord = {
                    from: { row: fromRow, col: fromCol },
                    to: { row: toRow, col: toCol },
                    piece: { ...piece },
                    captured: targetPiece ? { ...targetPiece } : null,
                    enPassantTarget: gameState.enPassantTarget,
                    castlingRights: JSON.parse(JSON.stringify(gameState.castlingRights)),
                    halfMoveClock: gameState.halfMoveClock,
                    check: false
                };
                
                // Handle en passant capture
                const possibleMove = gameState.possibleMoves.find(m => m.row === toRow && m.col === toCol);
                if (possibleMove && possibleMove.enPassant) {
                    const { row: epRow, col: epCol } = possibleMove.enPassant;
                    moveRecord.captured = { ...gameState.board[epRow][epCol] };
                    gameState.board[epRow][epCol] = null;
                }
                
                // Move the piece
                gameState.board[fromRow][fromCol] = null;
                gameState.board[toRow][toCol] = piece;
                
                // Mark the piece as moved (for pawns, rooks, kings)
                if (piece.type === 'pawn' || piece.type === 'rook' || piece.type === 'king') {
                    piece.hasMoved = true;
                }
                
                // Handle pawn promotion
                if (piece.type === 'pawn' && (toRow === 0 || toRow === 7)) {
                    showPromotionMenu(toRow, toCol, piece.color);
                    return;
                }
                
                // Handle castling
                if (piece.type === 'king' && Math.abs(toCol - fromCol) === 2) {
                    // Kingside castling
                    if (toCol > fromCol) {
                        const rook = gameState.board[toRow][7];
                        gameState.board[toRow][7] = null;
                        gameState.board[toRow][5] = rook;
                        rook.hasMoved = true;
                    } 
                    // Queenside castling
                    else {
                        const rook = gameState.board[toRow][0];
                        gameState.board[toRow][0] = null;
                        gameState.board[toRow][3] = rook;
                        rook.hasMoved = true;
                    }
                }
                
                // Update en passant target
                gameState.enPassantTarget = null;
                if (piece.type === 'pawn' && Math.abs(toRow - fromRow) === 2) {
                    gameState.enPassantTarget = { 
                        row: fromRow + (toRow - fromRow) / 2, 
                        col: fromCol 
                    };
                }
                
                // Update castling rights if king or rook moves
                if (piece.type === 'king') {
                    gameState.castlingRights[piece.color].kingSide = false;
                    gameState.castlingRights[piece.color].queenSide = false;
                } else if (piece.type === 'rook') {
                    if (fromCol === 0) {
                        gameState.castlingRights[piece.color].queenSide = false;
                    } else if (fromCol === 7) {
                        gameState.castlingRights[piece.color].kingSide = false;
                    }
                }
                
                // Update halfmove clock (for 50-move rule)
                if (piece.type === 'pawn' || (targetPiece && !possibleMove?.enPassant)) {
                    gameState.halfMoveClock = 0;
                } else {
                    gameState.halfMoveClock++;
                }
                
                // Update fullmove number after black's move
                if (gameState.currentPlayer === 'black') {
                    gameState.fullMoveNumber++;
                }
                
                // Switch player
                gameState.currentPlayer = gameState.currentPlayer === 'white' ? 'black' : 'white';
                
                // Check for check
                const opponentColor = gameState.currentPlayer;
                gameState.check = isKingInCheck(gameState.board, opponentColor);
                moveRecord.check = gameState.check;
                
                // Check for checkmate or stalemate
                const isCheckmate = gameState.check && !hasLegalMoves(opponentColor);
                const isStalemate = !gameState.check && !hasLegalMoves(opponentColor);
                
                if (isCheckmate) {
                    alert(`Checkmate! ${piece.color === 'white' ? 'White' : 'Black'} wins!`);
                } else if (isStalemate) {
                    alert("Stalemate! The game is a draw.");
                }
                
                // Add move to history
                gameState.moveHistory.push(moveRecord);
                
                // Update the board and game status
                gameState.selectedSquare = null;
                gameState.possibleMoves = [];
                updateBoardView();
                updateGameStatus();
                updateMoveHistory();
            }
            
            // Check if king is in check
            function isKingInCheck(board, kingColor) {
                // Find the king
                let kingRow, kingCol;
                for (let row = 0; row < 8; row++) {
                    for (let col = 0; col < 8; col++) {
                        const piece = board[row][col];
                        if (piece && piece.type === 'king' && piece.color === kingColor) {
                            kingRow = row;
                            kingCol = col;
                            break;
                        }
                    }
                    if (kingRow !== undefined) break;
                }
                
                return isSquareUnderAttack(board, kingRow, kingCol, kingColor);
            }
            
            // Check if a square is under attack
            function isSquareUnderAttack(board, row, col, defenderColor) {
                const attackerColor = defenderColor === 'white' ? 'black' : 'white';
                
                // Check for pawn attacks
                const pawnDirection = attackerColor === 'white' ? -1 : 1;
                for (const colOffset of [-1, 1]) {
                    const pawnRow = row - pawnDirection;
                    const pawnCol = col + colOffset;
                    if (isValidSquare(pawnRow, pawnCol)) {
                        const piece = board[pawnRow][pawnCol];
                        if (piece && piece.type === 'pawn' && piece.color === attackerColor) {
                            return true;
                        }
                    }
                }
                
                // Check for knight attacks
                const knightMoves = [
                    { dr: -2, dc: -1 }, { dr: -2, dc: 1 },
                    { dr: -1, dc: -2 }, { dr: -1, dc: 2 },
                    { dr: 1, dc: -2 }, { dr: 1, dc: 2 },
                    { dr: 2, dc: -1 }, { dr: 2, dc: 1 }
                ];
                
                for (const move of knightMoves) {
                    const knightRow = row + move.dr;
                    const knightCol = col + move.dc;
                    if (isValidSquare(knightRow, knightCol)) {
                        const piece = board[knightRow][knightCol];
                        if (piece && piece.type === 'knight' && piece.color === attackerColor) {
                            return true;
                        }
                    }
                }
                
                // Check for sliding pieces (rook, bishop, queen)
                const slidingDirections = [
                    { dr: -1, dc: 0 }, // up
                    { dr: 1, dc: 0 },  // down
                    { dr: 0, dc: -1 }, // left
                    { dr: 0, dc: 1 },  // right
                    { dr: -1, dc: -1 }, // up-left
                    { dr: -1, dc: 1 },  // up-right
                    { dr: 1, dc: -1 },  // down-left
                    { dr: 1, dc: 1 }    // down-right
                ];
                
                for (const dir of slidingDirections) {
                    for (let i = 1; i < 8; i++) {
                        const checkRow = row + i * dir.dr;
                        const checkCol = col + i * dir.dc;
                        
                        if (!isValidSquare(checkRow, checkCol)) break;
                        
                        const piece = board[checkRow][checkCol];
                        if (!piece) continue;
                        
                        if (piece.color === defenderColor) break;
                        
                        // Check piece type based on direction
                        if (dir.dr === 0 || dir.dc === 0) {
                            // Rook or queen
                            if (piece.type === 'rook' || piece.type === 'queen') {
                                return true;
                            }
                        } else {
                            // Bishop or queen
                            if (piece.type === 'bishop' || piece.type === 'queen') {
                                return true;
                            }
                        }
                        
                        // Any other piece blocks the line
                        break;
                    }
                }
                
                // Check for king (adjacent squares)
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        if (dr === 0 && dc === 0) continue;
                        
                        const kingRowCheck = row + dr;
                        const kingColCheck = col + dc;
                        
                        if (isValidSquare(kingRowCheck, kingColCheck)) {
                            const piece = board[kingRowCheck][kingColCheck];
                            if (piece && piece.type === 'king' && piece.color === attackerColor) {
                                return true;
                            }
                        }
                    }
                }
                
                return false;
            }
            
            // Check if player has any legal moves
            function hasLegalMoves(color) {
                for (let row = 0; row < 8; row++) {
                    for (let col = 0; col < 8; col++) {
                        const piece = gameState.board[row][col];
                        if (piece && piece.color === color) {
                            const moves = getPossibleMoves(row, col);
                            if (moves.length > 0) {
                                return true;
                            }
                        }
                    }
                }
                return false;
            }
            
            // Show promotion menu
            function showPromotionMenu(row, col, color) {
                const promotionMenu = document.getElementById('promotion-menu');
                promotionMenu.style.top = `${row * 70 + 35}px`;
                promotionMenu.style.left = `${col * 70 + 35}px`;
                promotionMenu.classList.remove('hidden');
                
                // Set up promotion selection
                promotionMenu.querySelectorAll('div[data-piece]').forEach(option => {
                    option.onclick = function() {
                        const pieceType = this.dataset.piece;
                        promotePawn(row, col, color, pieceType);
                        promotionMenu.classList.add('hidden');
                    };
                });
            }
            
            // Promote a pawn
            function promotePawn(row, col, color, pieceType) {
                gameState.board[row][col] = { type: pieceType, color };
                
                // Complete the move
                gameState.currentPlayer = gameState.currentPlayer === 'white' ? 'black' : 'white';
                
                // Check for check
                const opponentColor = gameState.currentPlayer;
                gameState.check = isKingInCheck(gameState.board, opponentColor);
                
                // Update the last move record
                if (gameState.moveHistory.length > 0) {
                    const lastMove = gameState.moveHistory[gameState.moveHistory.length - 1];
                    lastMove.promotion = pieceType;
                    lastMove.check = gameState.check;
                }
                
                // Check for checkmate or stalemate
                const isCheckmate = gameState.check && !hasLegalMoves(opponentColor);
                const isStalemate = !gameState.check && !hasLegalMoves(opponentColor);
                
                if (isCheckmate) {
                    alert(`Checkmate! ${color === 'white' ? 'White' : 'Black'} wins!`);
                } else if (isStalemate) {
                    alert("Stalemate! The game is a draw.");
                }
                
                // Update the board and game status
                gameState.selectedSquare = null;
                gameState.possibleMoves = [];
                updateBoardView();
                updateGameStatus();
                updateMoveHistory();
            }
            
            // Undo the last move
            function undoMove() {
                if (gameState.moveHistory.length === 0) return;
                
                const lastMove = gameState.moveHistory.pop();
                
                // Restore the moved piece
                gameState.board[lastMove.from.row][lastMove.from.col] = lastMove.piece;
                
                // Restore the captured piece or clear the square
                if (lastMove.captured) {
                    gameState.board[lastMove.to.row][lastMove.to.col] = lastMove.captured;
                } else {
                    gameState.board[lastMove.to.row][lastMove.to.col] = null;
                }
                
                // Restore en passant target
                gameState.enPassantTarget = lastMove.enPassantTarget;
                
                // Restore castling rights
                gameState.castlingRights = lastMove.castlingRights;
                
                // Restore halfmove clock
                gameState.halfMoveClock = lastMove.halfMoveClock;
                
                // Restore fullmove number if needed
                if (gameState.currentPlayer === 'white') {
                    gameState.fullMoveNumber--;
                }
                
                // Switch player back
                gameState.currentPlayer = gameState.currentPlayer === 'white' ? 'black' : 'white';
                
                // Reset check status
                gameState.check = false;
                
                // Update the board and game status
                gameState.selectedSquare = null;
                gameState.possibleMoves = [];
                updateBoardView();
                updateGameStatus();
                updateMoveHistory();
            }
            
            // Update game status display
            function updateGameStatus() {
                const statusElement = document.getElementById('game-status');
                let statusText = `${gameState.currentPlayer === 'white' ? 'White' : 'Black'}'s turn`;
                
                if (gameState.check) {
                    statusText += " - CHECK!";
                }
                
                statusElement.textContent = statusText;
            }
            
            // Update move history display
            function updateMoveHistory() {
                const historyList = document.getElementById('history-list');
                historyList.innerHTML = '';
                
                // Group moves into pairs (white and black)
                for (let i = 0; i < gameState.moveHistory.length; i += 2) {
                    const movePair = document.createElement('div');
                    movePair.className = 'flex justify-between mb-1';
                    
                    // White move
                    const whiteMove = gameState.moveHistory[i];
                    const whiteMoveText = formatMove(whiteMove, i + 1);
                    
                    const whiteMoveElement = document.createElement('span');
                    whiteMoveElement.textContent = whiteMoveText;
                    movePair.appendChild(whiteMoveElement);
                    
                    // Black move (if exists)
                    if (i + 1 < gameState.moveHistory.length) {
                        const blackMove = gameState.moveHistory[i + 1];
                        const blackMoveText = formatMove(blackMove);
                        
                        const blackMoveElement = document.createElement('span');
                        blackMoveElement.textContent = blackMoveText;
                        movePair.appendChild(blackMoveElement);
                    }
                    
                    historyList.appendChild(movePair);
                }
                
                // Scroll to bottom
                historyList.scrollTop = historyList.scrollHeight;
            }
            
            // Format a move for display
            function formatMove(move, moveNumber = null) {
                const piece = move.piece;
                const from = move.from;
                const to = move.to;
                const captured = move.captured;
                
                let moveText = '';
                
                // Add move number for white moves
                if (moveNumber) {
                    moveText += `${moveNumber}. `;
                }
                
                // Piece type (except pawn)
                if (piece.type !== 'pawn') {
                    moveText += piece.type === 'knight' ? 'N' : piece.type[0].toUpperCase();
                }
                
                // Add file/rank if needed for disambiguation (simplified)
                if (piece.type === 'pawn' && captured) {
                    moveText += String.fromCharCode(97 + from.col);
                }
                
                // Capture notation
                if (captured) {
                    if (piece.type === 'pawn') {
                        moveText += String.fromCharCode(97 + from.col);
                    }
                    moveText += 'x';
                }
                
                // Destination square
                moveText += String.fromCharCode(97 + to.col) + (8 - to.row);
                
                // Promotion
                if (move.promotion) {
                    moveText += '=' + (move.promotion === 'knight' ? 'N' : move.promotion[0].toUpperCase());
                }
                
                // Check
                if (move.check) {
                    moveText += '+';
                }
                
                return moveText;
            }
            
            // Event listeners for buttons
            document.getElementById('new-game-btn').addEventListener('click', initializeBoard);
            document.getElementById('undo-btn').addEventListener('click', undoMove);
            
            // Initialize the game
            initializeBoard();
        });
    </script>
